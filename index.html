<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIPELA — Sistem Informasi Perencanaan Listrik Distribusi &amp; Aset</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=202609250654">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="logo" src="img/icon-96.png" alt=""><b title="Sistem Informasi Perencanaan Listrik Distribusi &amp; Aset">SIPELA</b>
      <select id="ulpSel" title="Pilih ULP"></select><select id="sysSel" title="Pilih sistem"></select></div>
    <nav id="nav">
      <button data-view="map" class="active">🗺 Peta</button>
      <button data-view="sld">⎓ SLD</button>
      <button data-view="assets">▦ Aset</button>
      <button data-view="lines">〰 Saluran</button>
      <button data-view="analysis">📊 Analisis</button>
      <button data-view="data" class="ro-hide">💾 Data</button>
    </nav>
    <div class="top-actions">
      <span id="appVer" class="muted" title="Versi aplikasi"></span>
      <span id="saveState" class="muted"></span>
      <button id="btnUndo" class="btn sm ro-hide" title="Undo (Ctrl+Z)">↶ Undo</button>
      <span id="userBadge" class="badge"></span>
      <button id="btnLogout" class="btn sm" title="Keluar">Keluar</button>
    </div>
  </header>

  <main>
    <section id="view-map" class="view active">
      <div id="map"></div>
      <aside id="mapPanel" class="panel">
        <div class="tools">
          <div class="seg" id="modeSeg">
            <button data-mode="select">🖱 Pilih</button>
            <button data-mode="asset" class="ro-hide">➕ Aset</button>
            <button data-mode="line" class="ro-hide">〰 Saluran</button>
            <button data-mode="measure">📏 Ukur</button>
          </div>
          <div class="row">
            <input id="mapSearch" list="dlAssets" placeholder="Cari kode aset…" autocomplete="off">
            <button class="btn" id="btnGps" title="Lokasi saya">📍</button>
          </div>
          <div id="modeOpts"></div>
        </div>
        <div id="editor"></div>
      </aside>
    </section>
    <section id="view-sld" class="view"></section>
    <section id="view-assets" class="view"></section>
    <section id="view-lines" class="view"></section>
    <section id="view-analysis" class="view scroll"></section>
    <section id="view-data" class="view scroll"></section>
  </main>

  <datalist id="dlAssets"></datalist>
  <datalist id="dlFeeders"></datalist>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
  <script src="js/auth.js?v=202609250654"></script>
  <script src="js/store.js?v=202609250654"></script>
  <script src="js/sistem.js?v=202609250654"></script>
  <script src="js/calc.js?v=202609250654"></script>
  <script src="js/map.js?v=202609250654"></script>
  <script src="js/sld.js?v=202609250654"></script>
  <script src="js/io.js?v=202609250654"></script>
  <script src="js/gis.js?v=202609250654"></script>
  <script src="js/publish.js?v=202609250654"></script>
  <script src="js/equip.js?v=202609250654"></script>
  <script src="js/views.js?v=202609250654"></script>
  <script src="js/app.js?v=202609250654"></script>
</body>
</html>
